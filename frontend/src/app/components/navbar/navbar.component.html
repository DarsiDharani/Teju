<!-- 
  Navigation Bar Component
  - Displays application logo and navigation links
  - Responsive design with mobile hamburger menu
  - Shows/hides links based on authentication status
  - Includes notification bell for logged-in users
-->
<nav class="bg-gradient-to-r from-slate-900 to-slate-900 px-4 py-2 flex items-center justify-between text-white shadow-lg relative z-50 border-3 border-slate-800">

  <!-- Logo Section: Company branding and name -->
  <div class="flex items-center gap-2">
    <!-- Company Logo: Circular image with hover animation -->
    <img src="https://th.bing.com/th/id/OIP.ywRuSSxFyb5AoUlw3gZ2dgAAAA?w=179&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7"
      alt="SkillOrbit Logo"
      class="w-10 h-10 rounded-full bg-white p-1 shadow-md hover:scale-110 transition-transform duration-200" />
    <!-- Application Name -->
    <span class="text-lg font-bold">SkillOrbit</span>
  </div>

  <!-- Mobile Menu Toggle Button: Hamburger icon, visible only on small screens -->
  <button
    (click)="toggleMenu()"
    class="md:hidden p-2 rounded hover:bg-white/10 transition-colors"
  >
    <!-- Hamburger Icon: Three horizontal lines -->
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- 
    Navigation Menu Container
    - Mobile: Dropdown menu (controlled by isMenuOpen)
    - Desktop: Horizontal menu (always visible)
  -->
  <div
    [class.hidden]="!isMenuOpen"
    class="absolute md:relative top-full left-0 md:top-auto w-full md:w-auto bg-cyan-600 md:bg-transparent md:flex p-2 md:p-0 flex-col md:flex-row gap-1 shadow-lg md:shadow-none items-center"
  >
    <!-- Home Link: Navigate to landing page -->
    <a routerLink="/" routerLinkActive="bg-white/20" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-black/10 transition-colors">
      <i class="fa-solid fa-house w-5 text-center"></i>
      <span>Home</span>
    </a>
    
    <!-- About Link: Navigate to about page -->
    <a routerLink="/about" routerLinkActive="bg-white/20" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-white/10 transition-colors">
      <i class="fa-solid fa-circle-info w-5 text-center"></i>
      <span>About</span>
    </a>
    
    <!-- Links shown only when user is NOT logged in (public users) -->
    <ng-container *ngIf="!isLoggedIn()">
        <!-- Register Link: New user registration -->
        <a routerLink="/register" routerLinkActive="bg-white/20" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-white/10 transition-colors">
          <i class="fa-solid fa-user-plus w-5 text-center"></i>
          <span>Register</span>
        </a>
        <!-- Login Link: User authentication -->
        <a routerLink="/login" routerLinkActive="bg-white/20" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-white/10 transition-colors">
          <i class="fa-solid fa-right-to-bracket w-5 text-center"></i>
          <span>Login</span>
        </a>
    </ng-container>

    <!-- Links shown only when user IS logged in (authenticated users) -->
    <ng-container *ngIf="isLoggedIn()">
        <!-- Notifications Component: Bell icon with notification count badge -->
        <div class="flex items-center px-2">
          <app-notifications></app-notifications>
        </div>
        <!-- Logout Button: Ends user session and redirects to login -->
        <button (click)="logout()" class="flex items-center gap-2 text-left w-full md:w-auto px-3 py-2 rounded hover:bg-white/10 transition-colors">
          <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
          <span>Logout</span>
        </button>
    </ng-container>
  </div>
</nav>
